# fly.io configuration for REA Studio
# Generated by `fly launch`. Edit as needed.
#
# Deploy with:
#   fly deploy
#
# See DEPLOYMENT.md for full instructions.

app = "rea-studio"  # rename to your-username
primary_region = "iad"  # change to your nearest region

[build]
  # Bun-based image. fly.io auto-detects if you have a Dockerfile; otherwise
  # it uses Nixpacks which auto-detects Next.js.

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true   # set to false if you want always-on (costs free-tier quota faster)
  auto_start_machines = true
  min_machines_running = 0

# Persistent volume for SQLite + uploads.
# Create with: `fly volumes create rea_studio_data --size 1`
[[mounts]]
  source = "rea_studio_data"
  destination = "/data"

[env]
  DATABASE_URL = "file:/data/db/custom.db"
  REA_UPLOAD_DIR = "/data/uploads"
  REA_ENGINE_LABEL = "fly.io"

# Set secrets with: `fly secrets set ZAI_API_KEY=your_key`
